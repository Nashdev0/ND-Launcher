name: Build Windows EXE

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    name: Build Tauri on Windows
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    - name: Install Rust cache
      uses: swatinem/rust-cache@v2
      with:
        workspaces: src-tauri

    - name: Install Node dependencies
      run: npm install

    - name: Get app version
      id: get_version
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          echo "ver=${{ github.ref_name }}" | sed 's/^v//' >> $GITHUB_OUTPUT
        else
          echo "ver=$(grep '^version' src-tauri/Cargo.toml | head -1 | cut -d'"' -f2)" >> $GITHUB_OUTPUT
        fi
      shell: bash

    - name: Build the app
      run: npm run tauri build

    - name: Upload Windows executable
      uses: actions/upload-artifact@v4
      with:
        name: ND-Launcher-v${{ steps.get_version.outputs.ver }}-Windows
        path: |
          src-tauri/target/release/bundle/nsis/*.exe
          src-tauri/target/release/bundle/msi/*.msi

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: v${{ steps.get_version.outputs.ver }}
        name: ND Launcher v${{ steps.get_version.outputs.ver }}
        body: |
          ## Changelog v${{ steps.get_version.outputs.ver }}
          - Auto-release dari CI pipeline
        files: |
          src-tauri/target/release/bundle/nsis/*.exe
          src-tauri/target/release/bundle/msi/*.msi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

